name: Organizador
options:
  bundleIdPrefix: store.printoverse
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # 5.0 y no 6: el modo estricto de concurrencia de Swift 6 convierte en
    # errores avisos que en esta app no importan.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Organizador:
    type: application
    platform: iOS
    # Solo la carpeta de la app: Pruebas/ se compila aparte con swiftc en CI.
    sources:
      - Organizador
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: store.printoverse.organizador
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "NO"
    info:
      path: Organizador/Info.plist
      properties:
        CFBundleDisplayName: 3D Organizer
        CFBundleName: Organizador
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 3D Organizer usa la cámara para tomar la foto de cada modelo del pedido.
        NSPhotoLibraryUsageDescription: 3D Organizer abre tus fotos para que elijas la foto de cada modelo del pedido.
