# Nginx para sistema.printoverse.store (3D Organizer).
#
# Va en su propio archivo a proposito: el de PrintoVerse (sites-available/
# printoverse) no se toca, asi un fallo aqui no puede tumbar la tienda.
#
# nginx entrega la pagina (servidor/web/ copiada a /opt/sistema/publico) y solo
# le pasa a Python lo que empieza por /api/ y /health.
#
# Se instala en /etc/nginx/sites-available/sistema (lo hace desplegar.sh).

upstream sistema_app {
    server unix:/run/sistema/gunicorn.sock fail_timeout=0;
}

# ── HTTP: solo sirve para dos cosas ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sistema.printoverse.store;

    # 1. Que Let's Encrypt pueda renovar. Va ANTES del redirect: si tambien se
    #    redirige el desafio, la renovacion falla y el certificado caduca en
    #    silencio a los 90 dias.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. Mandar a todo el mundo a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── El sitio ──────────────────────────────────────────────
server {
    # 'http2 on;' suelto es de nginx 1.25 en adelante; aqui corre la 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistema.printoverse.store;

    ssl_certificate     /etc/letsencrypt/live/sistema.printoverse.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema.printoverse.store/privkey.pem;

    # Solo TLS 1.2 y 1.3, igual que PrintoVerse. Mismo nombre y tamaño de la zona
    # de sesiones que el de la tienda: nginx exige que coincidan.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/sistema/publico;
    index index.html;

    # Las fotos de los modelos pesan hasta 3 MB (lo limita la app); el limite de
    # fabrica de nginx es 1 MB.
    client_max_body_size 4m;

    charset utf-8;
    access_log /var/log/nginx/sistema.access.log;
    error_log  /var/log/nginx/sistema.error.log;

    # ── Cabeceras de seguridad ────────────────────────────
    # Escritas aqui y NO con `include` del fichero de PrintoVerse
    # (snippets/printoverse-seguridad.conf): ese manda Referrer-Policy
    # "strict-origin-when-cross-origin", y este sitio pide "no-referrer"; con las
    # dos saldrian dos cabeceras contradictorias. Ademas asi este sitio no
    # depende de un fichero que despliega otro proyecto.
    #
    # Son las mismas del snippet, salvo el Referrer-Policy y el noindex. Sus
    # directivas de CSP (object-src, base-uri, form-action, frame-ancestors) no
    # rompen esta pagina: no tiene <object>, <base> ni formularios que envien
    # fuera, y los estilos/scripts no se restringen.
    #
    # OJO: en nginx un `location` con un `add_header` propio descarta TODOS estos.
    # Por eso ningun location de abajo usa add_header; el no-cache va con
    # `expires`, que no tiene ese problema.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "no-referrer"        always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Es una herramienta privada: que Google no la liste.
    add_header X-Robots-Tag              "noindex, nofollow, noarchive" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Proxy a la app ────────────────────────────────────
    # Aqui arriba (y no dentro de cada location) para que /api/ y /health usen
    # exactamente lo mismo.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # La app limita los intentos de entrada por IP y se fia de X-Real-IP porque
    # SOLO se llega a ella por este nginx, que sobrescribe lo que mande el
    # cliente. Sin esta linea todas las peticiones le llegan como del mismo
    # sitio y el limite se lo come el primer visitante. NO QUITAR.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Nada que empiece por punto se sirve jamas. Va antes que las otras reglas
    # por expresion regular: nginx usa la primera que casa. (El desafio de
    # Let's Encrypt solo pasa por el puerto 80, no por aqui.)
    location ~ /\. {
        deny all;
        access_log off;
    }

    # '^~' corta la busqueda de expresiones regulares: la API siempre llega a la
    # app, pase lo que pase con el resto de reglas.
    location ^~ /api/ {
        proxy_pass http://sistema_app;
    }

    location = /health {
        proxy_pass http://sistema_app;
    }

    # Los .js y .css no llevan huella en el nombre, asi que NUNCA se cachean a
    # ciegas: si se desplegara un cambio y el navegador siguiera con el app.js
    # viejo, la pagina nueva hablaria con codigo viejo y fallaria sin explicacion.
    # `expires -1` ya manda su propio Cache-Control: no-cache (el navegador
    # pregunta y el ETag evita volver a bajar lo que no cambio). Con `=404` un
    # fichero que no existe da 404 de verdad y no la pagina de inicio.
    location ~* \.(js|css|map|png|ico|svg|webp|jpg|jpeg|woff2?)$ {
        expires -1;
        try_files $uri =404;
    }

    # Todo lo demas es la pagina. Tambien sin cache: si se cachea index.html, se
    # despliega un cambio y se sigue viendo la version vieja sin entender por que.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
